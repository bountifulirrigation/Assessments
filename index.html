<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Assessment Portal - 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 30px 0;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            color: var(--primary);
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .search-area {
            position: sticky;
            top: 10px;
            background: var(--bg);
            padding: 15px 0;
            z-index: 1000;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }

        #search-input {
            width: 100%;
            padding: 16px 24px;
            border: none;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 1.125rem;
            outline: none;
        }

        .stats {
            padding: 8px 15px 0;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        #results-list {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .record-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .record-card:hover {
            border-color: var(--accent);
        }

        .record-header {
            padding: 24px;
        }

        .address-title {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .serial-subtitle {
            display: inline-flex;
            align-items: center;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .record-body {
            display: none;
            padding: 0 24px 32px;
            border-top: 1px solid var(--border);
            background: #fafafa;
        }

        .record-card.expanded .record-body {
            display: block;
        }

        .section {
            margin-top: 32px;
        }

        .section-header {
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .assessment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .value {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--primary);
            word-break: break-all;
        }

        .asmnt-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .asmnt-year {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            display: block;
        }

        .asmnt-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .text-block {
            background: white;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9375rem;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .grid-3 { grid-template-columns: 1fr; }
            h1 { font-size: 1.75rem; }
            .address-title { font-size: 1.25rem; }
        }

        #loader {
            position: fixed; inset: 0; background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div id="loader">
    <p style="font-weight: 600; color: var(--primary);">Loading Database...</p>
</div>

<div class="container">
    <header>
        <h1>Property Assessments</h1>
    </header>

    <div class="search-area">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search Address or Serial Number..." autocomplete="off">
            <div id="search-stats" class="stats">Ready to search.</div>
        </div>
    </div>

    <div id="results-list"></div>
</div>

<script>
    let records = [];
    const searchInput = document.getElementById('search-input');
    const resultsList = document.getElementById('results-list');
    const stats = document.getElementById('search-stats');
    const loader = document.getElementById('loader');

    // Load Data
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            records = data;
            loader.style.display = 'none';
            stats.innerText = `Searching ${records.length.toLocaleString()} records...`;
        });

    function getYearVal(key) {
        if (key.startsWith('99')) return 1999;
        const m = key.match(/\d+/);
        if (!m) return 9999;
        let y = parseInt(m[0]);
        return y < 50 ? 2000 + y : 1900 + y;
    }

    function createCard(item) {
        const card = document.createElement('div');
        card.className = 'record-card';
        card.onclick = () => card.classList.toggle('expanded');

        // Column groups
        const ownerFields = ['OWNER', 'Owner Address', 'Owner city', 'Owner State', 'Owner Zip'];
        const accountFields = ['Service(s)', 'STATUS', 'Assessed With', 'Activity', 'assessable Acreage', 'ACREAGE', 'Acre Ft of Water', 'Group'];
        const ratesFields = ['2022 O&M Per Acre Ft', '2024 O&M Per Acre Ft', '2025 O&M Per Acre Ft', '2025 Condo Rate', 'special rate increase'];
        const notesFields = ['Legal Description', 'Special Notes', 'Other Description', 'Priors', 'Futures'];
        
        const assessments = [];
        Object.keys(item).forEach(k => {
            if (k.includes('ASMNT') || k.includes('ASSESSM')) {
                assessments.push({k, v: item[k], year: getYearVal(k)});
            }
        });
        assessments.sort((a, b) => a.year - b.year);

        const renderItems = (keys) => {
            return keys.map(k => {
                const val = item[k];
                if (val === undefined || val === '') return '';
                return `<div class="data-item"><span class="label">${k}</span><span class="value">${val}</span></div>`;
            }).join('');
        };

        const renderTextBlocks = (keys) => {
            return keys.map(k => {
                const val = item[k];
                if (!val) return '';
                return `
                    <div class="section">
                        <div class="section-header"><div class="section-title">${k}</div></div>
                        <div class="text-block">${val}</div>
                    </div>
                `;
            }).join('');
        };

        card.innerHTML = `
            <div class="record-header">
                <span class="address-title">${item['ADDRESS(COMB)']}</span>
                <div class="serial-subtitle">Serial: ${item['TAX SER NO']}</div>
            </div>
            <div class="record-body">
                <div class="section">
                    <div class="section-header"><div class="section-title">Owner Information</div></div>
                    <div class="grid-3">${renderItems(ownerFields)}</div>
                </div>

                <div class="section">
                    <div class="section-header"><div class="section-title">Account Information</div></div>
                    <div class="grid-3">${renderItems(accountFields)}</div>
                </div>

                <div class="section">
                    <div class="section-header"><div class="section-title">Rates & Fees</div></div>
                    <div class="grid-3">${renderItems(ratesFields)}</div>
                </div>

                <div class="section">
                    <div class="section-header"><div class="section-title">Assessment History</div></div>
                    <div class="assessment-grid">
                        ${assessments.map(a => `
                            <div class="asmnt-box">
                                <span class="asmnt-year">${a.k}</span>
                                <span class="asmnt-val">${typeof a.v === 'number' ? '$' + a.v.toLocaleString() : a.v}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${renderTextBlocks(notesFields)}
            </div>
        `;
        return card;
    }

    let searchTimer;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        const term = e.target.value.toLowerCase().trim();
        if (term.length < 2) { resultsList.innerHTML = ''; return; }

        searchTimer = setTimeout(() => {
            const matches = records.filter(r => 
                (r['ADDRESS(COMB)'] && r['ADDRESS(COMB)'].toLowerCase().includes(term)) ||
                (r['TAX SER NO'] && r['TAX SER NO'].toLowerCase().includes(term))
            );
            resultsList.innerHTML = '';
            stats.innerText = `Matches: ${matches.length.toLocaleString()}`;
            matches.slice(0, 50).forEach(m => resultsList.appendChild(createCard(m)));
            if (matches.length > 50) {
                const div = document.createElement('div');
                div.style.cssText = 'padding: 20px; text-align: center; color: var(--text-muted);';
                div.innerText = 'Showing first 50 results. Please refine your search.';
                resultsList.appendChild(div);
            }
        }, 300);
    });
</script>

</body>
</html>
